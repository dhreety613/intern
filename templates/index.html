<!DOCTYPE html>
<html>

<head>

    <title>Fetch History Dashboard</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="title">
    Fetch History
</div>

<div class="subtitle">
    Internal Developer Dashboard
</div>

<div class="container">

    <div class="card blue">

        <h2>🔷 Constant Contact + Pipedrive Sync</h2>

        <button onclick="run('/person-fetch')">
            Person Fetch
        </button>

        <button onclick="run('/person-clean')">
            Person Clean
        </button>

        <button onclick="run('/constant-contact/existing-emails')">
            Existing Emails
        </button>

        <button onclick="run('/constant-contact/upload')">
            Upload Contacts
        </button>

    </div>


    <div class="card pink">

        <h2>💗 CloudTalk → Fireflies</h2>

        <button onclick="run('/cloudtalk_lastweek_calls_all')">
            Fetch Calls
        </button>

        <button onclick="run('/filter_cloudtalk_calls')">
            Filter Calls
        </button>

        <button onclick="run('/download_cloudtalk_calls')">
            Download Calls
        </button>

        <button onclick="run('/upload_fireflies')">
            Upload Fireflies
        </button>

    </div>


    <div class="card white">

        <h2>Utilities</h2>

        <button onclick="run('/deal-history')">
            Deal History
        </button>

        <button onclick="run('/deal-history-delta')">
            Delta Sync
        </button>

        <button onclick="run('/health')">
            Health Check
        </button>

    </div>

</div>


<div id="response">

Ready

</div>

<script src="/static/script.js"></script>

</body>

</html>
